name: Tracer Bullet / 设计决策
description: 用最短路径验证一个高风险假设，并明确哪些完整性要求暂时后移
title: "[Decision] "
body:
  - type: markdown
    attributes:
      value: |
        本仓库以中文为主，接受必要的英文术语。

        V1 采用 tracer-bullet 思路：优先写清楚“要最快验证什么”“最短真实链路是什么”“什么不做”，而不是先设计完整平台。

  - type: textarea
    id: hypothesis
    attributes:
      label: 要验证的高风险假设
      description: 用一到三句话说明，如果这个假设不成立，后续大量工程都会失去意义。
      placeholder: 例如：把中文 request facet 做 embedding 后，是否能形成语义一致的 base clusters？
    validations:
      required: true

  - type: textarea
    id: shortest_path
    attributes:
      label: 最短真实链路
      description: 写出从真实输入到真实输出的最少 stage。允许固定配置，但不能用 mock 结果绕过核心风险。
      placeholder: |
        input JSONL
          -> one facet
          -> embedding
          -> clustering
          -> labels
          -> hierarchy.json
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 最小完成条件
      description: 只写能判断“方向值得继续”的 smoke criteria，不要把完整产品 KPI 塞进来。
      placeholder: |
        - 一条命令跑通
        - 至少两层 hierarchy
        - 没有丢记录或 cycle
        - 通过最低 clustering / 人工 label sanity check
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: 明确不做 / 后移
      description: 列出会增加横向完备性、但不直接回答当前假设的内容。
      placeholder: |
        - 多 provider abstraction
        - alternative clusterer
        - 完整 UI
        - 生产 privacy system
    validations:
      required: true

  - type: textarea
    id: simplifications
    attributes:
      label: V1 接受哪些简化？
      description: 例如固定 k、单一模型、整批重跑、单一 schema、硬编码 demo config。
    validations:
      required: true

  - type: textarea
    id: safety
    attributes:
      label: 数据与安全边界
      description: 说明这条 tracer bullet 允许使用什么数据、禁止使用什么数据，以及输出不能包含什么。
      placeholder: 例如：只用 synthetic / public demo data；report 不含 raw conversations；不作匿名化声明。
    validations:
      required: true

  - type: textarea
    id: next_decision
    attributes:
      label: 跑完后将根据什么结果决定下一步？
      description: 把可能的 failure mode 映射到下一项投入，避免预先承诺完整 roadmap。
      placeholder: 例如：若 leaf clustering 差，先研究 facet/embedding；若 parent fit 差，再研究 hierarchy algorithm。
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前检查
      options:
        - label: 这条路径穿过真实组件，没有用 mock 输出绕过核心风险。
          required: true
        - label: 我已经写明最小完成条件和明确 non-goals。
          required: true
        - label: 我没有因为“未来可能需要”而提前加入抽象层。
          required: true
        - label: 我没有把 embedding、摘要或聚类直接等同于匿名化。
          required: true

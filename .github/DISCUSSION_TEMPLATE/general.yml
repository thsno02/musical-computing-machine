name: RFC / 需求与设计讨论
description: 用于讨论项目目标、边界、架构、评估协议和重要设计决策
title: "[RFC] "
body:
  - type: markdown
    attributes:
      value: |
        感谢发起讨论。本仓库以中文为主，接受必要的英文术语。

        请优先描述“要解决的决策”和“明确不解决什么”，不要只给出某个库、模型或 UI 截图。

  - type: textarea
    id: decision
    attributes:
      label: 需要决定什么？
      description: 用一到三句话写出本帖希望形成的决定。
      placeholder: 例如：V1 是否允许 unassigned，还是所有记录必须强制进入某个 cluster？
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 背景与问题
      description: 当前行为、用户需求、数据规模、已知限制，以及为什么现在需要这个决定。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提案
      description: 描述建议方案、关键术语、输入输出和默认行为。
    validations:
      required: true

  - type: textarea
    id: boundaries
    attributes:
      label: 边界 / Non-goals
      description: 明确哪些内容不在本提案范围内，哪些承诺不能由本提案推出。
      placeholder: |
        In scope:
        - ...

        Out of scope:
        - ...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与 trade-offs
      description: 至少列出一个替代方案，以及质量、隐私、复杂度、成本和可维护性的差异。
    validations:
      required: true

  - type: textarea
    id: evaluation
    attributes:
      label: 如何验证？
      description: 写出数据集、指标、人工 rubric、失败条件和可复现实验。
      placeholder: 不接受“看起来合理”或“UMAP 很漂亮”作为唯一验证。
    validations:
      required: true

  - type: textarea
    id: privacy
    attributes:
      label: 隐私与滥用边界
      description: 说明 raw/derived/release data、访问者、发布模式和 fail-closed 条件；不适用时说明理由。
    validations:
      required: true

  - type: textarea
    id: rollout
    attributes:
      label: 最小交付与 rollout
      description: 描述最小 vertical slice、兼容性、迁移、回滚和 stop condition。
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前检查
      options:
        - label: 我已经区分 requirement、implementation choice 与 product UI。
          required: true
        - label: 我已经写明 in-scope 和 out-of-scope。
          required: true
        - label: 我已经给出可验证的 acceptance criteria。
          required: true
        - label: 我没有把 embedding、摘要或聚类直接等同于匿名化。
          required: true
